[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roundabout-ai"
version = "0.9.0"
description = "Local Android IP Webcam diagnostics and roundabout computer-vision demo"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "lap>=0.5.13,<0.6",
    "onnxruntime>=1.27,<2",
    "opencv-python>=5.0,<6",
    "PyYAML>=6.0.3,<7",
    "rapidocr>=3.9.2,<4",
    "streamlit>=1.60,<2",
    "ultralytics>=8.4.118,<9",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.411,<2",
    "pytest>=9,<10",
    "ruff>=0.16.3,<0.17",
]

[project.scripts]
roundabout-camera = "roundabout_ai.diagnostic:main"
roundabout-calibrate = "roundabout_ai.calibration_app:main"
roundabout-detect = "roundabout_ai.detection_app:main"
roundabout-dashboard = "roundabout_ai.dashboard:main"
roundabout-anpr-assess = "roundabout_ai.anpr_feasibility:main"
roundabout-anpr = "roundabout_ai.anpr_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "standard"
