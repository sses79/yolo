# Phase 0 currently accepts these settings as command-line options. This file
# records the intended values for the later shared application configuration.
camera:
  url: "http://192.168.1.142:8080/video"
  reconnect_seconds: 2.0
  open_timeout_seconds: 5.0
  read_timeout_seconds: 5.0
  stale_after_seconds: 2.0

# Phase 6 defaults to observation-only recommendations. The control URL is an
# explicit trust boundary and must not include /video. Automatic mode also
# requires the dashboard confirmation checkbox after manually reviewing all
# four presets on this specific phone and scene.
camera_adaptation:
  mode: "recommend" # off, recommend, or automatic
  control_url: "http://192.168.1.142:8080"
  control_timeout_seconds: 2.0
  quality_interval_seconds: 5.0
  minimum_profile_dwell_seconds: 300.0
  failed_switch_cooldown_seconds: 60.0
  capabilities_file: "data/camera/capabilities.json"
  automatic_confirmed: false

diagnostic:
  metrics_interval_seconds: 2.0
  snapshot_directory: "data/snapshots"
  recording_directory: "data/recordings"
  recording_seconds: 120
  recording_fps: 15.0

detection:
  model: "yolo26n.pt"
  device: "cpu"
  confidence: 0.35
  image_size: 640
  classes: [person, bicycle, car, motorcycle, bus, truck]

tracking:
  tracker_config: "bytetrack.yaml"
  minimum_track_age: 3
  maximum_missing_frames: 30
  # Relative image motion; this is not mph or km/h.
  fast_speed_threshold_box_heights_per_second: 1.0
  minimum_speed_observations: 3
  minimum_speed_duration_seconds: 0.5

# Generate this section interactively with `roundabout-calibrate`. Coordinates
# are pixels in the saved reference frame and scale to the live frame size.
scene:
  reference_size: [1920, 1080]
  roi: []
  count_lines: []

storage:
  save_raw_video: false
  # Opt-in: save an annotated event snapshot plus distinct raw vehicle crops.
  save_event_images: false
  event_file: "data/events/events.csv"
  event_crop_horizontal_padding: 0.15
  event_crop_vertical_padding: 0.10
  event_crop_minimum_width: 200
  event_crop_minimum_height: 100

dashboard:
  refresh_seconds: 0.2
  bind_address: "127.0.0.1"

# Phase 4 is a human-labelled camera feasibility gate. These are explicit
# project policy values, not OCR accuracy guarantees. List only lighting
# conditions relevant to the intended operating environment.
anpr_feasibility:
  minimum_samples: 20
  minimum_readable_rate: 0.8
  stop_readable_rate: 0.2
  minimum_median_character_height_px: 16
  required_lighting: []

# Phase 5 runs offline over saved vehicle crops and stays disabled until a
# plate-specific YOLO model is supplied. The general yolo26n.pt COCO model is
# not a plate detector. Registration text is neither shown nor stored by default.
anpr_prototype:
  enabled: false
  plate_model: "models/license-plate.pt"
  plate_class: "license_plate"
  detector_confidence: 0.35
  image_size: 640
  minimum_plate_size: [64, 16]
  minimum_sharpness: 40.0
  maximum_skew_degrees: 15.0
  maximum_ocr_candidates: 3
  minimum_ocr_confidence: 0.5
  minimum_agreement: 2
  require_uk_format: true
  store_plate_text: false
