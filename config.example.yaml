# Phase 0 currently accepts these settings as command-line options. This file
# records the intended values for the later shared application configuration.
camera:
  url: "http://192.168.1.142:8080/video"
  reconnect_seconds: 2.0
  open_timeout_seconds: 5.0
  read_timeout_seconds: 5.0
  stale_after_seconds: 2.0

diagnostic:
  metrics_interval_seconds: 2.0
  snapshot_directory: "data/snapshots"
  recording_directory: "data/recordings"
  recording_seconds: 120
  recording_fps: 15.0

detection:
  model: "yolo26n.pt"
  device: "cpu"
  confidence: 0.35
  image_size: 640
  classes: [person, bicycle, car, motorcycle, bus, truck]

tracking:
  tracker_config: "bytetrack.yaml"
  minimum_track_age: 3
  maximum_missing_frames: 30

# Generate this section interactively with `roundabout-calibrate`. Coordinates
# are pixels in the saved reference frame and scale to the live frame size.
scene:
  reference_size: [1920, 1080]
  roi: []
  count_lines: []

storage:
  save_raw_video: false
  # Opt-in: save an annotated event snapshot plus distinct raw vehicle crops.
  save_event_images: false
  event_file: "data/events/events.csv"
  event_crop_horizontal_padding: 0.15
  event_crop_vertical_padding: 0.10
  event_crop_minimum_width: 200
  event_crop_minimum_height: 100

dashboard:
  refresh_seconds: 0.2
  bind_address: "127.0.0.1"

# Phase 4 is a human-labelled camera feasibility gate. These are explicit
# project policy values, not OCR accuracy guarantees. List only lighting
# conditions relevant to the intended operating environment.
anpr_feasibility:
  minimum_samples: 20
  minimum_readable_rate: 0.8
  stop_readable_rate: 0.2
  minimum_median_character_height_px: 16
  required_lighting: []
